  <!-- Header Bar Line -->
  <line x1="22" y1="58" x2="278" y2="58" stroke="#0D2E62" stroke-width="5"/>
  
  <!-- School Name -->
  <text x="150" y="46" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#0D2E62" text-anchor="middle" letter-spacing="1">THE BRITISH CO-ED HIGH SCHOOL</text>
  
  <!-- Central Emblem: Stylized TB / Figure -->
  <g transform="translate(150, 150)">
    <!-- Head of figure (Orange-red with gold border) -->
    <circle cx="-24" cy="-76" r="13" fill="#D62828" stroke="#EAA823" stroke-width="5"/>
    
    <!-- Arms raised in V -->
