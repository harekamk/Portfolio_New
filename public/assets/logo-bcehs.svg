    <!-- Stylized Blue Body / J -->
    <path d="M-24 -46 L-24 50 C-24 78 -44 86 -62 80" fill="none" stroke="#0D2E62" stroke-width="14" stroke-linecap="round"/>
  </g>
  
  <!-- ENDEAVOUR Banner text -->
  <path id="curve" d="M70 240 Q150 286 230 240" fill="none"/>
  <text font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0D2E62" text-anchor="middle">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">ENDEAVOUR</textPath>
  </text>
  
  <!-- Laurel Leaves Left -->
  <g fill="#0D2E62">
    <path d="M42 210 Q32 198 38 184 Q48 196 42 210 Z"/>
    <path d="M50 236 Q38 226 42 212 Q54 224 50 236 Z"/>
    <path d="M64 260 Q50 252 52 238 Q66 248 64 260 Z"/>
